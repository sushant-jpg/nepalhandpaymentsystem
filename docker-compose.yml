name: nepal-hand-pay
services:
  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 4s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint: ["mongosh", "--host", "mongodb:27017", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  palm-service:
    build: ./services/palm-recognition
    environment:
      PALM_SERVICE_KEY: ${PALM_SERVICE_KEY:-local-service-key-change-me}
      PALM_TEMPLATE_ENCRYPTION_KEY: ${PALM_TEMPLATE_ENCRYPTION_KEY:-}
      PALM_DATABASE_PATH: /app/data/palm.db
    volumes: ["palm-data:/app/data"]
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/nepal_hand_pay?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      PALM_SERVICE_URL: http://palm-service:8001
      PALM_SERVICE_KEY: ${PALM_SERVICE_KEY:-local-service-key-change-me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      FRONTEND_URL: http://localhost:8080
      COOKIE_SECURE: "false"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      palm-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["4000:4000"]

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api/v1
        VITE_SOCKET_URL: http://localhost:4000
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  mongo-data:
  palm-data:
